<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>渡轮结算 · Iceberg v2 票号删除核对</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand">
      <span class="mark" aria-hidden="true">⛴</span>
      <div>
        <h1>渡轮结算 · 票号删除核对</h1>
        <p>Iceberg v2 源快照 · 仅位置删除（positional deletes）</p>
      </div>
    </div>
    <nav class="topnav">
      <a class="button ghost" href="{{ url_for('sample') }}">载入样例</a>
      <a class="button ghost" href="{{ url_for('index') }}">字段 ID 回填</a>
    </nav>
  </div>
</header>

<main class="wrap">
  {% include "partials/checker_body.html" %}
  {% include "partials/checker_form.html" %}
</main>

<footer class="footer">
  <div class="wrap">
    <p>
      位置删除匹配条件：删除记录的 <code>file_path</code> 等于原始路径、
      <code>pos</code> 等于从 0 起算的文件内行号，且删除文件的数据序列号不小于数据文件。
      缺失副本或任一读取失败都会中止整次核对。
    </p>
  </div>
</footer>
</body>
</html>
